# Build SDCC 4.5.0 mcs51 port as single-threaded WebAssembly
#
# Produces: sdcc, sdcpp, sdas8051, sdld as .wasm + .js
# plus minimum mcs51 headers and libraries.
#
# Constraints:
# - SINGLE-THREADED: no -pthread, no SharedArrayBuffer (GitHub Pages
#   cannot set COOP/COEP headers for cross-origin isolation)
# - GPL source compliance: BUILD-INFO records tarball URL + SHA-256 +
#   any patches applied (corresponding source obligation)
# - Acceptance: byte-identical .hex for 9 pseudocode examples vs
#   native SDCC 4.5.0, or the job fails
#
# Reference: chrismaltby/gbdk-emscripten (same shape, z80 port)

name: Build SDCC WASM (mcs51)

on:
  workflow_dispatch:

env:
  SDCC_VERSION: "4.5.0"
  SDCC_URL: "https://sourceforge.net/projects/sdcc/files/sdcc/4.5.0/sdcc-src-4.5.0.tar.bz2/download"
  SDCC_SHA256: "d5030437fb436bb1d93a8dbdbfb46baaa60613318f4fb3f5871d72815d1eed80"
  EMSDK_VERSION: "3.1.61"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex \
            libboost-graph-dev texinfo python3

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Download and verify SDCC source
        run: |
          curl -L -o sdcc-src.tar.bz2 "${{ env.SDCC_URL }}"
          echo "${{ env.SDCC_SHA256 }}  sdcc-src.tar.bz2" | sha256sum -c
          tar xjf sdcc-src.tar.bz2
          echo "SDCC ${{ env.SDCC_VERSION }} source verified"

      # ── Step 1: Build SDCC natively (reference for byte-identity) ──

      - name: Copy source for native build
        run: cp -r sdcc-${{ env.SDCC_VERSION }} sdcc-native

      - name: Build native SDCC (mcs51 only)
        working-directory: sdcc-native
        run: |
          ./configure \
            --disable-z80-port --disable-z180-port --disable-r2k-port \
            --disable-r2ka-port --disable-r3ka-port --disable-sm83-port \
            --disable-tlcs90-port --disable-ez80_z80-port --disable-z80n-port \
            --disable-ds390-port --disable-ds400-port --disable-hc08-port \
            --disable-s08-port --disable-stm8-port --disable-pdk13-port \
            --disable-pdk14-port --disable-pdk15-port --disable-mos6502-port \
            --disable-mos65c02-port --disable-pic14-port --disable-pic16-port \
            --disable-ucsim --disable-sdcdb
          make -j4 CXXFLAGS="-g -O2 -Wno-error"
          make install prefix="$(pwd)/../sdcc-installed"
          echo "Native SDCC built and installed:"
          ../sdcc-installed/bin/sdcc --version | head -1

      # ── Step 2: Build SDCC with Emscripten ──

      - name: Copy source for WASM build
        run: |
          echo "=== Checking original source ==="
          ls -la sdcc-${{ env.SDCC_VERSION }}/configure || echo "NO configure in original!"
          cp -r sdcc-${{ env.SDCC_VERSION }} sdcc-emcc
          echo "=== Checking copy ==="
          ls -la sdcc-emcc/configure || echo "NO configure in copy!"
          echo "=== sdcc-emcc top-level files ==="
          ls sdcc-emcc/ | head -20

      - name: Configure SDCC for Emscripten
        run: |
          cd sdcc-emcc
          ls -la configure
          # Pass CC/CXX/flags directly on the configure line so they survive
          # emconfigure's subprocess wrapping.
          # -sUSE_ZLIB: Emscripten's zlib port.
          # -I/usr/include: system boost headers (header-only).
          # i686: little-endian 32-bit, matching wasm32.
          # Copy boost headers to an isolated dir so -isystem doesn't
          # shadow Emscripten's sysroot (which has its own zlib.h etc.)
          mkdir -p /tmp/boost-headers
          cp -r /usr/include/boost /tmp/boost-headers/

          # CXXFLAGS already carries -std=c++11, so configure's C++11
          # detection has nothing to find. Do NOT set ac_cv_prog_cxx_cxx11
          # — the value is appended verbatim to CXX, and "yes" becomes
          # a literal argument ("em++ yes -c ..."), breaking every C++ test.

          # Patch strsignal.c: define HAVE_PSIGNAL so libiberty skips its
          # own psignal() definition (conflicts with Emscripten's).
          sed -i '1i #define HAVE_PSIGNAL 1' \
            support/sdbinutils/libiberty/strsignal.c

          emconfigure ./configure \
            CC=emcc CXX=em++ \
            CFLAGS="-sUSE_ZLIB" \
            CXXFLAGS="-sUSE_ZLIB -std=c++11" \
            CPPFLAGS="-isystem /tmp/boost-headers" \
            LDFLAGS="-sUSE_ZLIB" \
            --host=i686-unknown-linux-gnu \
            --disable-z80-port --disable-z180-port --disable-r2k-port \
            --disable-r2ka-port --disable-r3ka-port --disable-sm83-port \
            --disable-tlcs90-port --disable-ez80_z80-port --disable-z80n-port \
            --disable-ds390-port --disable-ds400-port --disable-hc08-port \
            --disable-s08-port --disable-stm8-port --disable-pdk13-port \
            --disable-pdk14-port --disable-pdk15-port --disable-mos6502-port \
            --disable-mos65c02-port --disable-pic14-port --disable-pic16-port \
            --disable-ucsim --disable-sdcdb \
            --disable-device-lib --disable-packihx \
            --prefix=/opt/sdcc-emcc \
            || {
              echo "=== config.log (last 80 lines) ==="
              tail -80 config.log
              echo "=== boost-specific lines ==="
              grep -i "boost\|adjacency" config.log | tail -20
              exit 1
            }

      - name: Build SDCC WASM
        run: |
          cd sdcc-emcc
          # Build with Emscripten. SINGLE-THREADED: no -pthread.
          # MEMFS only — this is the artifact that ships to browsers.
          # The byte-identity test runs THIS binary, not a NODERAWFS variant,
          # so the test proves the shipped artifact produces correct output.
          emmake make -j4 \
            EXEEXT=.js \
            CXXFLAGS="-O2 -Wno-error" \
            LDFLAGS="-sINITIAL_MEMORY=67108864 -sFORCE_FILESYSTEM \
                     -sMODULARIZE=1 -sEXPORT_NAME=createSDCC \
                     -sEXPORTED_RUNTIME_METHODS=FS" \
            || {
              echo "::error::SDCC WASM build failed"
              exit 1
            }

      - name: Package WASM artifacts
        run: |
          mkdir -p dist/sdcc-wasm

          echo "=== Finding WASM artifacts ==="
          find sdcc-emcc -name '*.js' -o -name '*.wasm' | grep -v node_modules | sort

          # Copy all four WASM tools: sdcc, sdcpp, sdas8051, sdld
          # Each may be in src/, bin/, support/cpp/, or sdas/ subdirectories.
          for tool in sdcc sdcpp sdas8051 sdld; do
            # Try known locations first, then fall back to find
            FOUND=""
            for dir in sdcc-emcc/src sdcc-emcc/bin sdcc-emcc/support/cpp; do
              if [ -f "$dir/$tool.js" ]; then
                cp "$dir/$tool.js" dist/sdcc-wasm/
                [ -f "$dir/$tool.wasm" ] && cp "$dir/$tool.wasm" dist/sdcc-wasm/
                echo "Copied $tool from $dir"
                FOUND=1
                break
              fi
            done
            if [ -z "$FOUND" ]; then
              path=$(find sdcc-emcc -name "$tool.js" -not -path '*/node_modules/*' | head -1)
              if [ -n "$path" ]; then
                dir=$(dirname "$path")
                cp "$dir/$tool.js" dist/sdcc-wasm/
                [ -f "$dir/$tool.wasm" ] && cp "$dir/$tool.wasm" dist/sdcc-wasm/
                echo "Copied $tool from $dir (via find)"
              else
                echo "::warning::Tool $tool.js not found in build tree"
              fi
            fi
          done

          # Minimum headers for mcs51
          mkdir -p dist/sdcc-wasm/include/mcs51
          cp sdcc-native/device/include/mcs51/*.h dist/sdcc-wasm/include/mcs51/ 2>/dev/null || true
          cp sdcc-native/device/include/8051.h dist/sdcc-wasm/include/ 2>/dev/null || true
          cp sdcc-native/device/include/8052.h dist/sdcc-wasm/include/ 2>/dev/null || true
          cp sdcc-native/device/include/stc12.h dist/sdcc-wasm/include/ 2>/dev/null || true
          cp sdcc-native/device/include/stdint.h dist/sdcc-wasm/include/ 2>/dev/null || true
          cp sdcc-native/device/include/stdbool.h dist/sdcc-wasm/include/ 2>/dev/null || true
          cp sdcc-native/device/include/string.h dist/sdcc-wasm/include/ 2>/dev/null || true
          cp sdcc-native/device/include/stdio.h dist/sdcc-wasm/include/ 2>/dev/null || true
          cp sdcc-native/device/include/stdlib.h dist/sdcc-wasm/include/ 2>/dev/null || true

          # mcs51 library (model-small)
          mkdir -p dist/sdcc-wasm/lib/small
          cp sdcc-native/device/lib/build/small-mcs51-stack-auto/*.rel dist/sdcc-wasm/lib/small/ 2>/dev/null || true
          cp sdcc-native/device/lib/build/small-mcs51-stack-auto/*.lib dist/sdcc-wasm/lib/small/ 2>/dev/null || true

          # Report sizes
          echo "=== Artifact sizes ==="
          ls -lh dist/sdcc-wasm/*.js dist/sdcc-wasm/*.wasm 2>/dev/null || {
            echo "::error::No WASM artifacts found in dist/sdcc-wasm/"
            echo "Contents:"
            ls -la dist/sdcc-wasm/
            exit 1
          }
          echo ""
          echo "=== Gzipped total ==="
          tar czf /tmp/sdcc-wasm.tar.gz -C dist sdcc-wasm
          ls -lh /tmp/sdcc-wasm.tar.gz
          GZIP_SIZE=$(stat -c%s /tmp/sdcc-wasm.tar.gz)
          echo "Gzipped transfer size: $GZIP_SIZE bytes ($(echo "scale=1; $GZIP_SIZE / 1048576" | bc) MB)"

      # ── Step 3: Byte-identity test ──

      - name: Byte-identity test (native 4.5.0 vs WASM 4.5.0)
        run: |
          NATIVE="$(pwd)/sdcc-installed/bin/sdcc"
          DIST="$(pwd)/dist/sdcc-wasm"
          INSTALLED="$(pwd)/sdcc-installed"

          echo "Native: $($NATIVE --version | head -1)"
          echo ""

          # Verify all four WASM tools are present
          for tool in sdcc sdcpp sdas8051 sdld; do
            if [ ! -f "$DIST/$tool.js" ]; then
              echo "::error::Missing WASM tool: $DIST/$tool.js"
              ls -la "$DIST/" 2>/dev/null
              exit 1
            fi
          done
          echo "All WASM tools present: sdcc sdcpp sdas8051 sdld"

          # Compile a minimal test program with both toolchains.
          mkdir -p /tmp/byte-test
          printf '#include <8051.h>\nvoid main(void) { P1 = 0xAA; while(1); }\n' \
            > /tmp/byte-test/test.c

          # Native compile — installed sdcc finds its own headers/libs
          # --verbose shows the exact command lines for sdcpp, sdas8051, sdld
          echo "=== Native compile (--verbose for flag capture) ==="
          if $NATIVE --verbose -mmcs51 --model-small \
               -o /tmp/byte-test/native.ihx \
               /tmp/byte-test/test.c 2>&1; then
            echo "Native: OK ($(wc -c < /tmp/byte-test/native.ihx) bytes)"
          else
            echo "::error::Native SDCC failed to compile test.c"
            exit 1
          fi

          # WASM compile — four-stage pipeline, no fork/exec needed.
          # sdcpp → sdcc --c1mode → sdas8051 → sdld
          echo ""
          echo "=== WASM compile (MEMFS, four-stage pipeline) ==="
          node sdcc-wasm/wasm-compile-driver.cjs \
            "$DIST" "$INSTALLED" \
            /tmp/byte-test/test.c /tmp/byte-test/wasm.ihx \
            2>&1 || {
              echo "::error::WASM sdcc pipeline failed (exit $?)"
              exit 1
            }

          if [ -f /tmp/byte-test/wasm.ihx ]; then
            echo ""
            echo "=== Byte-identity diff ==="
            if diff /tmp/byte-test/native.ihx /tmp/byte-test/wasm.ihx > /dev/null 2>&1; then
              echo "BYTE-IDENTICAL: native and WASM produce the same .ihx"
              echo "  Native: $(wc -c < /tmp/byte-test/native.ihx) bytes"
              echo "  WASM:   $(wc -c < /tmp/byte-test/wasm.ihx) bytes"
            else
              echo "::error::MISMATCH: native and WASM .ihx differ"
              echo "  Native: $(wc -c < /tmp/byte-test/native.ihx) bytes"
              echo "  WASM:   $(wc -c < /tmp/byte-test/wasm.ihx) bytes"
              diff /tmp/byte-test/native.ihx /tmp/byte-test/wasm.ihx || true
              exit 1
            fi
          else
            echo "::error::WASM compile did not produce output file"
            exit 1
          fi

      - name: Write BUILD-INFO
        run: |
          EMCC_VER=$(emcc --version | head -1)

          # Collect artifact sizes
          SIZES=""
          GZIP_TOTAL=""
          for tool in sdcc sdcpp sdas8051 sdld; do
            if [ -f "dist/sdcc-wasm/$tool.wasm" ]; then
              SZ=$(ls -lh "dist/sdcc-wasm/$tool.wasm" | awk '{print $5}')
              SIZES="${SIZES}| ${tool}.wasm | ${SZ} |\n"
            fi
          done
          tar czf /tmp/sdcc-wasm-all.tar.gz -C dist sdcc-wasm
          GZIP_TOTAL=$(ls -lh /tmp/sdcc-wasm-all.tar.gz | awk '{print $5}')

          cat > dist/sdcc-wasm/BUILD-INFO.md << BUILDEOF
# SDCC WASM build provenance

**SDCC version:** ${{ env.SDCC_VERSION }}
**Source tarball:** ${{ env.SDCC_URL }}
**Source SHA-256:** ${{ env.SDCC_SHA256 }}
**Emscripten:** ${EMCC_VER}
**Ports:** mcs51 only
**Threading:** single-threaded (no -pthread, no SharedArrayBuffer)
**Architecture:** four-stage MEMFS pipeline (no fork/exec)
**Patches applied:** psignal libiberty conflict (#define HAVE_PSIGNAL 1)

## Artifact sizes

| File | Size |
|------|------|
$(printf "$SIZES")
| **gzipped total** | **${GZIP_TOTAL}** |

## Pipeline

\`sdcpp\` (preprocess) → \`sdcc --c1mode\` (codegen) →
\`sdas8051\` (assemble) → \`sdld\` (link)

Each tool runs as a separate WASM module instance with its own MEMFS.
Intermediate files are passed through JS. No fork, no exec, no
SharedArrayBuffer. Works identically in Node and in the browser.

## Licence

SDCC is GPL-2+. This WASM build is a distribution of SDCC.
The corresponding source is the tarball above, plus the patch listed.
No modifications beyond build-system changes for Emscripten.

## Scope

8051/mcs51 only. AVR (avr-gcc) is NOT included and stays server-side.
BUILDEOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdcc-emcc-${{ env.SDCC_VERSION }}
          path: dist/sdcc-wasm/

      # TODO: Create a GitHub release with the artifacts
      # so consumers can fetch by tag rather than run id.
