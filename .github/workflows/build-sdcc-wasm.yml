# Build SDCC 4.5.0 mcs51 port as single-threaded WebAssembly
#
# Produces: sdcc, sdcpp, sdas8051, sdld as .wasm + .js
# plus minimum mcs51 headers and libraries.
#
# Constraints:
# - SINGLE-THREADED: no -pthread, no SharedArrayBuffer (GitHub Pages
#   cannot set COOP/COEP headers for cross-origin isolation)
# - GPL source compliance: BUILD-INFO records tarball URL + SHA-256 +
#   any patches applied (corresponding source obligation)
# - Acceptance: byte-identical .hex for 9 pseudocode examples vs
#   native SDCC 4.5.0, or the job fails
#
# Reference: chrismaltby/gbdk-emscripten (same shape, z80 port)

name: Build SDCC WASM (mcs51)

on:
  workflow_dispatch:

env:
  SDCC_VERSION: "4.5.0"
  SDCC_URL: "https://sourceforge.net/projects/sdcc/files/sdcc/4.5.0/sdcc-src-4.5.0.tar.bz2/download"
  SDCC_SHA256: "d5030437fb436bb1d93a8dbdbfb46baaa60613318f4fb3f5871d72815d1eed80"
  EMSDK_VERSION: "3.1.61"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex \
            libboost-graph-dev texinfo python3

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Download and verify SDCC source
        run: |
          curl -L -o sdcc-src.tar.bz2 "${{ env.SDCC_URL }}"
          echo "${{ env.SDCC_SHA256 }}  sdcc-src.tar.bz2" | sha256sum -c
          tar xjf sdcc-src.tar.bz2
          echo "SDCC ${{ env.SDCC_VERSION }} source verified"

      # ── Step 1: Build SDCC natively (reference for byte-identity) ──

      - name: Copy source for native build
        run: cp -r sdcc-${{ env.SDCC_VERSION }} sdcc-native

      - name: Build native SDCC (mcs51 only)
        working-directory: sdcc-native
        run: |
          ./configure \
            --disable-z80-port --disable-z180-port --disable-r2k-port \
            --disable-r2ka-port --disable-r3ka-port --disable-sm83-port \
            --disable-tlcs90-port --disable-ez80_z80-port --disable-z80n-port \
            --disable-ds390-port --disable-ds400-port --disable-hc08-port \
            --disable-s08-port --disable-stm8-port --disable-pdk13-port \
            --disable-pdk14-port --disable-pdk15-port --disable-mos6502-port \
            --disable-mos65c02-port --disable-pic14-port --disable-pic16-port \
            --disable-ucsim --disable-sdcdb
          make -j4 CXXFLAGS="-g -O2 -Wno-error"
          make install prefix="$(pwd)/../sdcc-installed"
          echo "Native SDCC built and installed:"
          ../sdcc-installed/bin/sdcc --version | head -1

      # ── Step 2: Build SDCC with Emscripten ──

      - name: Copy source for WASM build
        run: |
          echo "=== Checking original source ==="
          ls -la sdcc-${{ env.SDCC_VERSION }}/configure || echo "NO configure in original!"
          cp -r sdcc-${{ env.SDCC_VERSION }} sdcc-emcc
          echo "=== Checking copy ==="
          ls -la sdcc-emcc/configure || echo "NO configure in copy!"
          echo "=== sdcc-emcc top-level files ==="
          ls sdcc-emcc/ | head -20

      - name: Configure SDCC for Emscripten
        run: |
          cd sdcc-emcc
          ls -la configure
          # Pass CC/CXX/flags directly on the configure line so they survive
          # emconfigure's subprocess wrapping.
          # -sUSE_ZLIB: Emscripten's zlib port.
          # -I/usr/include: system boost headers (header-only).
          # i686: little-endian 32-bit, matching wasm32.
          # Copy boost headers to an isolated dir so -isystem doesn't
          # shadow Emscripten's sysroot (which has its own zlib.h etc.)
          mkdir -p /tmp/boost-headers
          cp -r /usr/include/boost /tmp/boost-headers/

          # CXXFLAGS already carries -std=c++11, so configure's C++11
          # detection has nothing to find. Do NOT set ac_cv_prog_cxx_cxx11
          # — the value is appended verbatim to CXX, and "yes" becomes
          # a literal argument ("em++ yes -c ..."), breaking every C++ test.

          # Patch strsignal.c: define HAVE_PSIGNAL so libiberty skips its
          # own psignal() definition (conflicts with Emscripten's).
          sed -i '1i #define HAVE_PSIGNAL 1' \
            support/sdbinutils/libiberty/strsignal.c

          # Pass WASM link flags at CONFIGURE time so autoconf bakes them
          # into every generated Makefile in the tree — including support/cpp
          # (sdcpp). This is the fix for sdcpp not receiving MODULARIZE/FS:
          # command-line make variables do not propagate to sub-makes that
          # assign LDFLAGS themselves, but configure-time LDFLAGS do.
          WASM_LDFLAGS="-sUSE_ZLIB -sINITIAL_MEMORY=67108864 -sFORCE_FILESYSTEM"
          WASM_LDFLAGS="$WASM_LDFLAGS -sMODULARIZE=1 -sEXPORT_NAME=createSDCC"
          WASM_LDFLAGS="$WASM_LDFLAGS -sEXPORTED_RUNTIME_METHODS=FS"

          emconfigure ./configure \
            CC=emcc CXX=em++ \
            CFLAGS="-sUSE_ZLIB" \
            CXXFLAGS="-sUSE_ZLIB -std=c++11" \
            CPPFLAGS="-isystem /tmp/boost-headers" \
            LDFLAGS="$WASM_LDFLAGS" \
            --host=i686-unknown-linux-gnu \
            --disable-z80-port --disable-z180-port --disable-r2k-port \
            --disable-r2ka-port --disable-r3ka-port --disable-sm83-port \
            --disable-tlcs90-port --disable-ez80_z80-port --disable-z80n-port \
            --disable-ds390-port --disable-ds400-port --disable-hc08-port \
            --disable-s08-port --disable-stm8-port --disable-pdk13-port \
            --disable-pdk14-port --disable-pdk15-port --disable-mos6502-port \
            --disable-mos65c02-port --disable-pic14-port --disable-pic16-port \
            --disable-ucsim --disable-sdcdb \
            --disable-device-lib --disable-packihx \
            --prefix=/opt/sdcc-emcc \
            || {
              echo "=== config.log (last 80 lines) ==="
              tail -80 config.log
              echo "=== boost-specific lines ==="
              grep -i "boost\|adjacency" config.log | tail -20
              exit 1
            }

      - name: Build SDCC WASM
        run: |
          cd sdcc-emcc
          # Build with Emscripten. SINGLE-THREADED: no -pthread.
          # MEMFS only — this is the artifact that ships to browsers.
          # The byte-identity test runs THIS binary, not a NODERAWFS variant,
          # so the test proves the shipped artifact produces correct output.
          # LDFLAGS already baked in by configure. Only EXEEXT and CXXFLAGS here.
          emmake make -j4 \
            EXEEXT=.js \
            CXXFLAGS="-O2 -Wno-error" \
            || {
              echo "::error::SDCC WASM build failed"
              exit 1
            }

      - name: Install sdcpp from make output
        run: |
          cd sdcc-emcc
          mkdir -p bin
          # make builds cpp in support/cpp/gcc/ with correct flags (LDFLAGS
          # from configure propagate). Output is 'cpp' not 'cpp.js' because
          # EXEEXT doesn't reach the sub-make. Just copy and rename.
          # 'cpp' is a DRIVER that spawns cc1 — hits the same fork wall.
          # 'cc1' is the self-contained preprocessor (libcpp + main).
          # Ship cc1 as sdcpp. Keep its original names for the wasm reference.
          CPP_DIR=support/cpp/gcc
          if [ -f "$CPP_DIR/cc1" ] && [ -f "$CPP_DIR/cc1.wasm" ]; then
            cp "$CPP_DIR/cc1" bin/cc1.js
            cp "$CPP_DIR/cc1.wasm" bin/cc1.wasm
            echo "sdcpp = cc1 (self-contained preprocessor):"
            ls -lh bin/cc1.js bin/cc1.wasm
          else
            echo "::error::make did not produce cc1 + cc1.wasm in $CPP_DIR"
            ls -la "$CPP_DIR"/ 2>/dev/null | head -20
            exit 1
          fi

          # Smoke test: each tool must start without attempting fork/exec
          echo "=== Smoke test: all tools respond to --version ==="
          for tool in sdcc sdas8051 sdld; do
            T="bin/$tool.js"
            [ -f "$T" ] || T="src/$tool.js"
            if [ -f "$T" ]; then
              timeout 10 node "$T" --version 2>&1 | head -1 || echo "$tool: no --version"
            fi
          done
          # cc1 uses -E for preprocessing; --version should still work
          timeout 10 node bin/cc1.js --version 2>&1 | head -1 || echo "cc1: no --version"

      - name: Verify all WASM tools are modularized
        run: |
          cd sdcc-emcc
          # Assert every tool exports a factory function with FS.
          # Catches flag propagation failures in one run, not one per run.
          node -e "
            const tools = ['sdcc', 'sdas8051', 'sdld'];
            // Preprocessor is cc1 (self-contained, no fork)
            const sdcppPath = require('fs').existsSync('bin/cc1.js')
              ? 'bin/cc1.js' : null;
            let ok = true;
            for (const t of tools) {
              const p = 'bin/' + t + '.js';
              try {
                const m = require('./' + p);
                if (typeof m !== 'function') {
                  console.error(t + ': NOT modularized (typeof=' + typeof m + ')');
                  ok = false;
                } else {
                  console.log(t + ': OK (factory)');
                }
              } catch(e) {
                // May be in src/ instead of bin/
                try {
                  const m2 = require('./src/' + t + '.js');
                  if (typeof m2 !== 'function') {
                    console.error(t + ': NOT modularized');
                    ok = false;
                  } else {
                    console.log(t + ': OK (factory, in src/)');
                  }
                } catch(e2) {
                  console.error(t + ': not found in bin/ or src/');
                  ok = false;
                }
              }
            }
            if (sdcppPath) {
              const m = require('./' + sdcppPath);
              if (typeof m !== 'function') {
                console.error('sdcpp: NOT modularized (typeof=' + typeof m + ')');
                ok = false;
              } else {
                console.log('sdcpp: OK (factory)');
              }
            } else {
              console.error('sdcpp: not found');
              ok = false;
            }
            if (!ok) { process.exit(1); }
            console.log('All tools modularized.');
          "

      - name: Package WASM artifacts
        run: |
          mkdir -p dist/sdcc-wasm

          echo "=== Finding WASM artifacts ==="
          find sdcc-emcc -name '*.js' -o -name '*.wasm' | grep -v node_modules | sort

          # Copy all four WASM tools: sdcc, cc1, sdas8051, sdld
          # cc1 is the self-contained preprocessor (not cpp, which is a driver).
          for tool in sdcc cc1 sdas8051 sdld; do
            # Try known locations first, then fall back to find
            FOUND=""
            for dir in sdcc-emcc/src sdcc-emcc/bin sdcc-emcc/support/cpp; do
              if [ -f "$dir/$tool.js" ]; then
                cp "$dir/$tool.js" dist/sdcc-wasm/
                [ -f "$dir/$tool.wasm" ] && cp "$dir/$tool.wasm" dist/sdcc-wasm/
                echo "Copied $tool from $dir"
                FOUND=1
                break
              fi
            done
            if [ -z "$FOUND" ]; then
              path=$(find sdcc-emcc -name "$tool.js" -not -path '*/node_modules/*' | head -1)
              if [ -n "$path" ]; then
                dir=$(dirname "$path")
                cp "$dir/$tool.js" dist/sdcc-wasm/
                [ -f "$dir/$tool.wasm" ] && cp "$dir/$tool.wasm" dist/sdcc-wasm/
                echo "Copied $tool from $dir (via find)"
              else
                echo "::error::Tool $tool.js not found anywhere in build tree"
                find sdcc-emcc -name "$tool*" 2>/dev/null || echo "  (no files matching $tool*)"
                exit 1
              fi
            fi
          done

          # Minimum headers for mcs51
          mkdir -p dist/sdcc-wasm/include/mcs51
          cp sdcc-native/device/include/mcs51/*.h dist/sdcc-wasm/include/mcs51/ 2>/dev/null || true
          cp sdcc-native/device/include/8051.h dist/sdcc-wasm/include/ 2>/dev/null || true
          cp sdcc-native/device/include/8052.h dist/sdcc-wasm/include/ 2>/dev/null || true
          cp sdcc-native/device/include/stc12.h dist/sdcc-wasm/include/ 2>/dev/null || true
          cp sdcc-native/device/include/stdint.h dist/sdcc-wasm/include/ 2>/dev/null || true
          cp sdcc-native/device/include/stdbool.h dist/sdcc-wasm/include/ 2>/dev/null || true
          cp sdcc-native/device/include/string.h dist/sdcc-wasm/include/ 2>/dev/null || true
          cp sdcc-native/device/include/stdio.h dist/sdcc-wasm/include/ 2>/dev/null || true
          cp sdcc-native/device/include/stdlib.h dist/sdcc-wasm/include/ 2>/dev/null || true

          # mcs51 library (model-small)
          mkdir -p dist/sdcc-wasm/lib/small
          # Native sdcc --model-small uses lib/small (not small-stack-auto).
          # small-stack-auto has different crt0 and produces a 1-byte origin shift.
          LIB_BUILD=sdcc-native/device/lib/build/small
          [ -d "$LIB_BUILD" ] || LIB_BUILD=sdcc-native/device/lib/build/small-stack-auto
          cp "$LIB_BUILD"/*.rel dist/sdcc-wasm/lib/small/ 2>/dev/null || true
          cp "$LIB_BUILD"/*.lib dist/sdcc-wasm/lib/small/ 2>/dev/null || true
          echo "Lib files: $(ls dist/sdcc-wasm/lib/small/ 2>/dev/null | wc -l) from $LIB_BUILD"

          # Report sizes
          echo "=== Artifact sizes ==="
          ls -lh dist/sdcc-wasm/*.js dist/sdcc-wasm/*.wasm 2>/dev/null || {
            echo "::error::No WASM artifacts found in dist/sdcc-wasm/"
            echo "Contents:"
            ls -la dist/sdcc-wasm/
            exit 1
          }
          echo ""
          echo "=== Gzipped total ==="
          tar czf /tmp/sdcc-wasm.tar.gz -C dist sdcc-wasm
          ls -lh /tmp/sdcc-wasm.tar.gz
          GZIP_SIZE=$(stat -c%s /tmp/sdcc-wasm.tar.gz)
          echo "Gzipped transfer size: $GZIP_SIZE bytes ($(echo "scale=1; $GZIP_SIZE / 1048576" | bc) MB)"

      # ── Step 3: Byte-identity test ──

      - name: Byte-identity test (native 4.5.0 vs WASM 4.5.0)
        run: |
          NATIVE="$(pwd)/sdcc-installed/bin/sdcc"
          DIST="$(pwd)/dist/sdcc-wasm"
          INSTALLED="$(pwd)/sdcc-installed"

          echo "Native: $($NATIVE --version | head -1)"
          echo ""

          # Verify all four WASM tools are present
          for tool in sdcc cc1 sdas8051 sdld; do
            if [ ! -f "$DIST/$tool.js" ]; then
              echo "::error::Missing WASM tool: $DIST/$tool.js"
              ls -la "$DIST/" 2>/dev/null
              exit 1
            fi
          done
          echo "All WASM tools present: sdcc cc1 sdas8051 sdld"

          # Compile a minimal test program with both toolchains.
          mkdir -p /tmp/byte-test
          printf '#include <8051.h>\nvoid main(void) { P1 = 0xAA; while(1); }\n' \
            > /tmp/byte-test/test.c

          # Native compile — installed sdcc finds its own headers/libs
          # --verbose shows the exact command lines for sdcpp, sdas8051, sdld
          echo "=== Native compile (--verbose for flag capture) ==="
          # -E produces .i (preprocessed), -S produces .asm, -c produces .rel
          $NATIVE -E -mmcs51 --model-small \
               -o /tmp/byte-test/native.i \
               /tmp/byte-test/test.c 2>/dev/null || true
          $NATIVE -S -mmcs51 --model-small \
               -o /tmp/byte-test/native.asm \
               /tmp/byte-test/test.c 2>/dev/null || true
          $NATIVE -c -mmcs51 --model-small \
               -o /tmp/byte-test/native.rel \
               /tmp/byte-test/test.c 2>/dev/null || true

          $NATIVE --verbose -mmcs51 --model-small \
               -o /tmp/byte-test/native.ihx \
               /tmp/byte-test/test.c > /tmp/byte-test/native-verbose.log 2>&1
          if [ -f /tmp/byte-test/native.ihx ]; then
            echo "Native: OK ($(wc -c < /tmp/byte-test/native.ihx) bytes)"
            # Dump native .lk and .map for comparison
            # Version-matched .optsdcc check: does 4.5.0 --c1mode emit it?
            echo "=== Native 4.5.0 --c1mode .optsdcc check ==="
            $NATIVE -E -mmcs51 --model-small /tmp/byte-test/test.c 2>/dev/null \
              | $NATIVE --c1mode -mmcs51 --model-small -o /tmp/byte-test/c1mode-check.asm 2>/dev/null
            if grep -q '\.optsdcc' /tmp/byte-test/c1mode-check.asm 2>/dev/null; then
              echo "4.5.0 --c1mode DOES emit .optsdcc (WASM omission is a defect)"
            else
              echo "4.5.0 --c1mode does NOT emit .optsdcc (injection is driver reconstruction)"
            fi
            echo "=== Native .lk file ==="
            cat /tmp/byte-test/native.lk 2>/dev/null || echo "(not found)"
            echo "=== Native .map (all areas) ==="
            grep "bytes (" /tmp/byte-test/native.map 2>/dev/null | head -25 || echo "(no map)"
          else
            echo "::error::Native SDCC failed to compile test.c"
            exit 1
          fi

          # WASM compile — four-stage pipeline, no fork/exec needed.
          # sdcpp → sdcc --c1mode → sdas8051 → sdld
          echo ""
          echo "=== WASM compile (MEMFS, four-stage pipeline) ==="
          # Run the pipeline; capture exit code but don't fail yet —
          # sdld may exit non-zero (e.g. missing .lst) while still
          # producing a valid .ihx. Judge by the output file.
          PIPELINE_EXIT=0
          node sdcc-wasm/wasm-compile-driver.cjs \
            "$DIST" "$INSTALLED" \
            /tmp/byte-test/test.c /tmp/byte-test/wasm.ihx \
            2>&1 || PIPELINE_EXIT=$?

          if [ "$PIPELINE_EXIT" -ne 0 ]; then
            echo "::warning::Pipeline exited with code $PIPELINE_EXIT"
          fi

          if [ ! -f /tmp/byte-test/wasm.ihx ]; then
            echo "::error::WASM compile did not produce output file"
            exit 1
          fi

          echo ""
          echo "=== Byte-identity comparison ==="
          echo "  Native .ihx: $(wc -c < /tmp/byte-test/native.ihx) bytes"
          echo "  WASM .ihx:   $(wc -c < /tmp/byte-test/wasm.ihx) bytes"

          # ── Compare images and print a self-contained summary ──
          # grep -A10 "BYTE-IDENTITY SUMMARY" answers the whole question.

          # 1. Intermediate comparisons (split the pipeline)
          I_STATUS="missing"
          ICODE_STATUS="missing"
          ASM_STATUS="missing"
          REL_STATUS="missing"
          FLAGS_STATUS="not compared"

          # .i: preprocessed output (stage 1)
          if [ -f /tmp/byte-test/native.i ] && [ -f /tmp/byte-test/wasm.i ]; then
            if diff /tmp/byte-test/native.i /tmp/byte-test/wasm.i > /dev/null 2>&1; then
              I_STATUS="identical"
              ICODE_STATUS="identical"
            else
              I_STATUS="differ"
              # i-code: strip #line markers (paths CANNOT match) and compare
              grep -v '^#' /tmp/byte-test/native.i > /tmp/byte-test/native.i-code
              grep -v '^#' /tmp/byte-test/wasm.i > /tmp/byte-test/wasm.i-code
              if diff /tmp/byte-test/native.i-code /tmp/byte-test/wasm.i-code > /dev/null 2>&1; then
                ICODE_STATUS="identical"
              else
                ICODE_STATUS="differ"
              fi
            fi
          fi

          # flags: compare native driver's argv with our reconstructed argv
          # Native --verbose prints "sdcc: sdcpp <flags>" — extract that line
          NATIVE_CPP_FLAGS=$(grep "^sdcc: sdcpp " /tmp/byte-test/native-verbose.log 2>/dev/null \
            | sed 's/^sdcc: sdcpp //' | tr ' ' '\n' | grep '^-D\|^-isystem\|^-std' | sort)
          WASM_CPP_FLAGS=$(echo "
            -nostdinc -Wall -std=c11
            -D__SDCC_CHAR_UNSIGNED -D__SDCC_MODEL_SMALL -D__SDCC_FLOAT_REENT
            -D__SDCCCALL=0 -D__SDCC=4_5_0 -D__SDCC_VERSION_MAJOR=4
            -D__SDCC_VERSION_MINOR=5 -D__SDCC_VERSION_PATCH=0 -DSDCC=450
            -D__SDCC_REVISION=15242 -D__SDCC_mcs51
            -D__STDC_NO_COMPLEX__=1 -D__STDC_NO_THREADS__=1
            -D__STDC_NO_ATOMICS__=1 -D__STDC_NO_VLA__=1
            -D__STDC_ISO_10646__=201409L -D__STDC_UTF_16__=1 -D__STDC_UTF_32__=1
            -D__SIZEOF_FLOAT__=4 -D__SIZEOF_DOUBLE__=4
            -D__SDCC_BITINT_MAXWIDTH=64
            -isystem /include/mcs51 -isystem /include
          " | tr -s ' \n' '\n' | grep '^-D\|^-isystem\|^-std' | sort)
          if [ -n "$NATIVE_CPP_FLAGS" ]; then
            echo "$NATIVE_CPP_FLAGS" > /tmp/byte-test/native-flags.txt
            echo "$WASM_CPP_FLAGS" > /tmp/byte-test/wasm-flags.txt
            if diff /tmp/byte-test/native-flags.txt /tmp/byte-test/wasm-flags.txt > /dev/null 2>&1; then
              FLAGS_STATUS="identical"
            else
              FLAGS_STATUS="differ"
            fi
          fi

          # .asm: codegen output (stage 2)
          if [ -f /tmp/byte-test/native.asm ] && [ -f /tmp/byte-test/wasm.asm ]; then
            if diff /tmp/byte-test/native.asm /tmp/byte-test/wasm.asm > /dev/null 2>&1; then
              ASM_STATUS="identical"
            else
              ASM_STATUS="differ"
            fi
          fi

          # .rel: assembler output (stage 3)
          if [ -f /tmp/byte-test/native.rel ] && [ -f /tmp/byte-test/wasm.rel ]; then
            if diff /tmp/byte-test/native.rel /tmp/byte-test/wasm.rel > /dev/null 2>&1; then
              REL_STATUS="identical"
            else
              REL_STATUS="differ"
            fi
          fi

          # 2. Image comparison — write to file to preserve formatting
          set +e
          python3 sdcc-wasm/compare-ihx.py \
            /tmp/byte-test/native.ihx /tmp/byte-test/wasm.ihx \
            > /tmp/byte-test/ihx-compare.txt 2>&1
          IHX_EXIT=$?
          set -e

          # 3. Print summary block
          echo ""
          echo "=== BYTE-IDENTITY SUMMARY ==="
          echo "i:       $I_STATUS"
          echo "i-code:  $ICODE_STATUS"
          echo "flags:   $FLAGS_STATUS"
          echo "asm:     $ASM_STATUS"
          echo "rel:     $REL_STATUS"
          cat /tmp/byte-test/ihx-compare.txt
          if [ "$IHX_EXIT" -eq 0 ]; then
            echo "verdict: PASS"
          else
            echo "verdict: FAIL"
          fi
          echo "=== END BYTE-IDENTITY SUMMARY ==="

          # 4. On mismatch: show detail, then fail
          if [ "$IHX_EXIT" -ne 0 ]; then
            echo ""
            echo "=== Raw .ihx first 3 records ==="
            echo "Native:"
            head -3 /tmp/byte-test/native.ihx
            echo "WASM:"
            head -3 /tmp/byte-test/wasm.ihx
            if [ "$FLAGS_STATUS" = "differ" ]; then
              echo ""
              echo "=== Flag differences (native vs WASM) ==="
              diff /tmp/byte-test/native-flags.txt /tmp/byte-test/wasm-flags.txt || true
            fi
            if [ "$ICODE_STATUS" = "differ" ]; then
              echo ""
              echo "First .i-code difference (# lines stripped):"
              diff /tmp/byte-test/native.i-code /tmp/byte-test/wasm.i-code | head -20
            fi
            if [ "$ASM_STATUS" = "differ" ]; then
              echo ""
              echo "First .asm difference:"
              diff /tmp/byte-test/native.asm /tmp/byte-test/wasm.asm | head -20
            fi
            if [ "$REL_STATUS" = "differ" ]; then
              echo ""
              echo "=== .rel area lines (A records) ==="
              echo "Native:"
              grep "^A " /tmp/byte-test/native.rel 2>/dev/null || echo "(none)"
              echo "WASM:"
              grep "^A " /tmp/byte-test/wasm.rel 2>/dev/null || echo "(none)"
              echo ""
              echo "Full .rel diff:"
              diff /tmp/byte-test/native.rel /tmp/byte-test/wasm.rel | head -25
            fi
            echo ""
            echo "::error::Byte-identity test FAILED"
            exit 1
          fi

      - name: Write BUILD-INFO
        run: |
          EMCC_VER=$(emcc --version | head -1)
          BINFO=dist/sdcc-wasm/BUILD-INFO.md

          # Collect artifact sizes
          {
            echo "# SDCC WASM build provenance"
            echo ""
            echo "SDCC version: ${{ env.SDCC_VERSION }}"
            echo "Source tarball: ${{ env.SDCC_URL }}"
            echo "Source SHA-256: ${{ env.SDCC_SHA256 }}"
            echo "Emscripten: $EMCC_VER"
            echo "Ports: mcs51 only"
            echo "Threading: single-threaded (no -pthread, no SharedArrayBuffer)"
            echo "Architecture: four-stage MEMFS pipeline (no fork/exec)"
            echo "Patches: psignal libiberty conflict (HAVE_PSIGNAL)"
            echo ""
            echo "## Artifact sizes"
            echo ""
            echo "| File | Size |"
            echo "|------|------|"
            for tool in sdcc cc1 sdas8051 sdld; do
              if [ -f "dist/sdcc-wasm/$tool.wasm" ]; then
                SZ=$(ls -lh "dist/sdcc-wasm/$tool.wasm" | awk '{print $5}')
                echo "| ${tool}.wasm | ${SZ} |"
              fi
            done
            tar czf /tmp/sdcc-wasm-all.tar.gz -C dist sdcc-wasm
            GZIP_SZ=$(ls -lh /tmp/sdcc-wasm-all.tar.gz | awk '{print $5}')
            echo "| gzipped total | ${GZIP_SZ} |"
            echo ""
            echo "## Pipeline"
            echo ""
            echo "sdcpp (preprocess) -> sdcc --c1mode (codegen) ->"
            echo "sdas8051 (assemble) -> sdld (link)"
            echo ""
            echo "Each tool runs as a separate WASM module with its own MEMFS."
            echo "No fork, no exec, no SharedArrayBuffer."
            echo ""
            echo "## Licence"
            echo ""
            echo "SDCC is GPL-2+. This WASM build is a distribution of SDCC."
            echo "Corresponding source: tarball above plus patch listed."
            echo ""
            echo "## Scope"
            echo ""
            echo "8051/mcs51 only. AVR (avr-gcc) stays server-side."
          } > "$BINFO"
          echo "BUILD-INFO written:"
          cat "$BINFO"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdcc-emcc-${{ env.SDCC_VERSION }}
          path: dist/sdcc-wasm/

      # TODO: Create a GitHub release with the artifacts
      # so consumers can fetch by tag rather than run id.
