# Build SDCC 4.5.0 mcs51 port as single-threaded WebAssembly
#
# Produces: sdcc, sdcpp, sdas8051, sdld as .wasm + .js
# plus minimum mcs51 headers and libraries.
#
# Constraints:
# - SINGLE-THREADED: no -pthread, no SharedArrayBuffer (GitHub Pages
#   cannot set COOP/COEP headers for cross-origin isolation)
# - GPL source compliance: BUILD-INFO records tarball URL + SHA-256 +
#   any patches applied (corresponding source obligation)
# - Acceptance: byte-identical .hex for 9 pseudocode examples vs
#   native SDCC 4.5.0, or the job fails
#
# Reference: chrismaltby/gbdk-emscripten (same shape, z80 port)

name: Build SDCC WASM (mcs51)

on:
  workflow_dispatch:

env:
  SDCC_VERSION: "4.5.0"
  SDCC_URL: "https://sourceforge.net/projects/sdcc/files/sdcc/4.5.0/sdcc-src-4.5.0.tar.bz2/download"
  SDCC_SHA256: "d5030437fb436bb1d93a8dbdbfb46baaa60613318f4fb3f5871d72815d1eed80"
  EMSDK_VERSION: "3.1.61"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex \
            libboost-graph-dev texinfo python3

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Download and verify SDCC source
        run: |
          curl -L -o sdcc-src.tar.bz2 "${{ env.SDCC_URL }}"
          echo "${{ env.SDCC_SHA256 }}  sdcc-src.tar.bz2" | sha256sum -c
          tar xjf sdcc-src.tar.bz2
          echo "SDCC ${{ env.SDCC_VERSION }} source verified"

      # ── Step 1: Build SDCC natively (reference for byte-identity) ──

      - name: Copy source for native build
        run: cp -r sdcc-${{ env.SDCC_VERSION }} sdcc-native

      - name: Build native SDCC (mcs51 only)
        working-directory: sdcc-native
        run: |
          ./configure \
            --disable-z80-port --disable-z180-port --disable-r2k-port \
            --disable-r2ka-port --disable-r3ka-port --disable-sm83-port \
            --disable-tlcs90-port --disable-ez80_z80-port --disable-z80n-port \
            --disable-ds390-port --disable-ds400-port --disable-hc08-port \
            --disable-s08-port --disable-stm8-port --disable-pdk13-port \
            --disable-pdk14-port --disable-pdk15-port --disable-mos6502-port \
            --disable-mos65c02-port --disable-pic14-port --disable-pic16-port \
            --disable-ucsim --disable-sdcdb
          make -j4 CXXFLAGS="-g -O2 -Wno-error"
          echo "Native SDCC built:"
          src/sdcc --version | head -1

      # ── Step 2: Build SDCC with Emscripten ──

      - name: Copy source for WASM build
        run: |
          echo "=== Checking original source ==="
          ls -la sdcc-${{ env.SDCC_VERSION }}/configure || echo "NO configure in original!"
          cp -r sdcc-${{ env.SDCC_VERSION }} sdcc-emcc
          echo "=== Checking copy ==="
          ls -la sdcc-emcc/configure || echo "NO configure in copy!"
          echo "=== sdcc-emcc top-level files ==="
          ls sdcc-emcc/ | head -20

      - name: Configure SDCC for Emscripten
        run: |
          cd sdcc-emcc
          ls -la configure
          # Pass CC/CXX/flags directly on the configure line so they survive
          # emconfigure's subprocess wrapping.
          # -sUSE_ZLIB: Emscripten's zlib port.
          # -I/usr/include: system boost headers (header-only).
          # i686: little-endian 32-bit, matching wasm32.
          # Copy boost headers to an isolated dir so -isystem doesn't
          # shadow Emscripten's sysroot (which has its own zlib.h etc.)
          mkdir -p /tmp/boost-headers
          cp -r /usr/include/boost /tmp/boost-headers/

          # CXXFLAGS already carries -std=c++11, so configure's C++11
          # detection has nothing to find. Do NOT set ac_cv_prog_cxx_cxx11
          # — the value is appended verbatim to CXX, and "yes" becomes
          # a literal argument ("em++ yes -c ..."), breaking every C++ test.

          emconfigure ./configure \
            CC=emcc CXX=em++ \
            CFLAGS="-sUSE_ZLIB" \
            CXXFLAGS="-sUSE_ZLIB -std=c++11" \
            CPPFLAGS="-isystem /tmp/boost-headers" \
            LDFLAGS="-sUSE_ZLIB" \
            --host=i686-unknown-linux-gnu \
            --disable-z80-port --disable-z180-port --disable-r2k-port \
            --disable-r2ka-port --disable-r3ka-port --disable-sm83-port \
            --disable-tlcs90-port --disable-ez80_z80-port --disable-z80n-port \
            --disable-ds390-port --disable-ds400-port --disable-hc08-port \
            --disable-s08-port --disable-stm8-port --disable-pdk13-port \
            --disable-pdk14-port --disable-pdk15-port --disable-mos6502-port \
            --disable-mos65c02-port --disable-pic14-port --disable-pic16-port \
            --disable-ucsim --disable-sdcdb \
            --disable-device-lib --disable-packihx \
            --disable-sdbinutils \
            --prefix=/opt/sdcc-emcc \
            || {
              echo "=== config.log (last 80 lines) ==="
              tail -80 config.log
              echo "=== boost-specific lines ==="
              grep -i "boost\|adjacency" config.log | tail -20
              exit 1
            }

      - name: Build SDCC WASM
        run: |
          cd sdcc-emcc
          # Build with Emscripten. SINGLE-THREADED: no -pthread.
          # Pass WASM flags only at link time via LDFLAGS.
          emmake make -j4 \
            CXXFLAGS="-O2 -Wno-error" \
            LDFLAGS="-sALLOW_MEMORY_GROWTH -sFORCE_FILESYSTEM \
                     -sEXIT_RUNTIME=1 -sINVOKE_RUN=0 \
                     -sEXPORTED_RUNTIME_METHODS=callMain,FS" \
            || {
              echo "::error::SDCC WASM build failed"
              echo "If this is a configure/link error, it may be a genuine"
              echo "blocker for Emscripten cross-compilation of SDCC."
              exit 1
            }

      - name: Package WASM artifacts
        run: |
          mkdir -p dist/sdcc-wasm

          # Copy WASM binaries
          for tool in sdcc sdcpp; do
            if [ -f sdcc-emcc/src/$tool.js ]; then
              cp sdcc-emcc/src/$tool.js sdcc-emcc/src/$tool.wasm dist/sdcc-wasm/
            fi
          done

          # Assembler and linker
          for tool in sdas8051 sdld; do
            for dir in sdcc-emcc/sdas/as8051 sdcc-emcc/sdas/linksrc sdcc-emcc/support/sdbinutils/binutils; do
              if [ -f "$dir/$tool.js" ]; then
                cp "$dir/$tool.js" "$dir/$tool.wasm" dist/sdcc-wasm/
                break
              fi
            done
          done

          # Minimum headers for mcs51
          mkdir -p dist/sdcc-wasm/include/mcs51
          cp sdcc-native/device/include/mcs51/*.h dist/sdcc-wasm/include/mcs51/ 2>/dev/null || true
          cp sdcc-native/device/include/8051.h dist/sdcc-wasm/include/ 2>/dev/null || true
          cp sdcc-native/device/include/8052.h dist/sdcc-wasm/include/ 2>/dev/null || true
          cp sdcc-native/device/include/stc12.h dist/sdcc-wasm/include/ 2>/dev/null || true
          cp sdcc-native/device/include/stdint.h dist/sdcc-wasm/include/ 2>/dev/null || true
          cp sdcc-native/device/include/stdbool.h dist/sdcc-wasm/include/ 2>/dev/null || true
          cp sdcc-native/device/include/string.h dist/sdcc-wasm/include/ 2>/dev/null || true
          cp sdcc-native/device/include/stdio.h dist/sdcc-wasm/include/ 2>/dev/null || true
          cp sdcc-native/device/include/stdlib.h dist/sdcc-wasm/include/ 2>/dev/null || true

          # mcs51 library (model-small)
          mkdir -p dist/sdcc-wasm/lib/small
          cp sdcc-native/device/lib/build/small-mcs51-stack-auto/*.rel dist/sdcc-wasm/lib/small/ 2>/dev/null || true
          cp sdcc-native/device/lib/build/small-mcs51-stack-auto/*.lib dist/sdcc-wasm/lib/small/ 2>/dev/null || true

          # Report sizes
          echo "=== Artifact sizes ==="
          ls -lh dist/sdcc-wasm/*.js dist/sdcc-wasm/*.wasm 2>/dev/null || echo "No WASM artifacts found"
          echo ""
          echo "=== Gzipped total ==="
          tar czf /tmp/sdcc-emcc.tar.gz -C dist sdcc-emcc
          ls -lh /tmp/sdcc-emcc.tar.gz
          GZIP_SIZE=$(stat -c%s /tmp/sdcc-emcc.tar.gz)
          echo "Gzipped transfer size: $GZIP_SIZE bytes ($(echo "scale=1; $GZIP_SIZE / 1048576" | bc) MB)"

      # ── Step 3: Byte-identity test ──

      - name: Byte-identity test (9 examples)
        run: |
          # Clone stc repo for the example C sources
          # (or use the checked-in test images)
          NATIVE_SDCC="$(pwd)/sdcc-native/bin/sdcc"

          # TODO: compile 9 pseudocode examples with both native and WASM SDCC
          # and diff the .hex output. For now, check that native works.
          echo "Native SDCC version:"
          $NATIVE_SDCC --version | head -1

          echo ""
          echo "TODO: byte-identity test requires wiring the WASM toolchain"
          echo "into a Node.js driver that can compile C files."

      - name: Write BUILD-INFO
        run: |
          EMCC_VER=$(emcc --version | head -1)
          cat > dist/sdcc-wasm/BUILD-INFO.md << EOF
          # SDCC WASM build provenance

          **SDCC version:** ${{ env.SDCC_VERSION }}
          **Source tarball:** ${{ env.SDCC_URL }}
          **Source SHA-256:** ${{ env.SDCC_SHA256 }}
          **Emscripten:** $EMCC_VER
          **Ports:** mcs51 only
          **Threading:** single-threaded (no -pthread, no SharedArrayBuffer)
          **Patches applied:** (none / list here if any)

          ## Licence

          SDCC is GPL-2+. This WASM build is a distribution of SDCC.
          The corresponding source is the tarball above, plus any patches
          listed. No modifications beyond build-system changes for
          Emscripten cross-compilation.

          ## Scope

          8051/mcs51 only. AVR (avr-gcc) is NOT included and stays
          server-side.
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdcc-emcc-${{ env.SDCC_VERSION }}
          path: dist/sdcc-wasm/

      # TODO: Create a GitHub release with the artifacts
      # so consumers can fetch by tag rather than run id.
