<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STC12 WebSerial Flash</title>
<style>
  body { font-family: monospace; max-width: 640px; margin: 2em auto; }
  button { font-size: 1.1em; padding: 0.4em 1em; margin: 0.3em; }
  button:disabled { opacity: 0.4; }
  textarea { width: 100%; height: 10em; font-family: monospace; font-size: 0.9em; }
  #log { white-space: pre-wrap; background: #111; color: #0f0; padding: 1em;
         height: 16em; overflow-y: auto; border-radius: 4px; }
  .warn { color: #fa0; }
</style>
</head>
<body>
<h2>STC12 WebSerial Flash</h2>
<p>Flash an Intel HEX file to an STC12C5A60S2 over WebSerial.<br>
Requires Chrome or Edge. The chip must be <strong>cold power-cycled</strong>
(not reset) after clicking Flash.</p>

<div>
  <label>HEX file: <input type="file" id="hexFile" accept=".hex,.ihx"></label>
  <span id="fileInfo"></span>
</div>
<div style="margin-top:0.5em">
  Or paste hex: <textarea id="hexText" placeholder=":03000000020006F5&#10;..."></textarea>
</div>
<div style="margin-top:0.5em">
  <button id="btnFlash" disabled>Flash</button>
  <button id="btnStop" disabled>Stop</button>
  <span id="status"></span>
</div>
<div id="log"></div>

<script type="module">
import { flashStc12, parseIntelHex } from './stc-flash.js';

const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
const btnFlash = document.getElementById('btnFlash');
const btnStop = document.getElementById('btnStop');
const hexFileInput = document.getElementById('hexFile');
const hexTextArea = document.getElementById('hexText');
const fileInfo = document.getElementById('fileInfo');

let hexContent = '';
let abortCtrl = null;

function log(msg) {
  logEl.textContent += msg + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = cls || '';
}

// Load hex from file
hexFileInput.addEventListener('change', async () => {
  const file = hexFileInput.files[0];
  if (!file) return;
  hexContent = await file.text();
  try {
    const { image } = parseIntelHex(hexContent);
    fileInfo.textContent = `${image.length} bytes`;
    btnFlash.disabled = false;
  } catch (e) {
    fileInfo.textContent = `error: ${e.message}`;
    btnFlash.disabled = true;
  }
});

// Load hex from textarea
hexTextArea.addEventListener('input', () => {
  const text = hexTextArea.value.trim();
  if (!text) { btnFlash.disabled = true; return; }
  hexContent = text;
  try {
    const { image } = parseIntelHex(hexContent);
    fileInfo.textContent = `${image.length} bytes`;
    btnFlash.disabled = false;
  } catch (e) {
    fileInfo.textContent = `error: ${e.message}`;
    btnFlash.disabled = true;
  }
});

// Check WebSerial support
if (!navigator.serial) {
  log('WebSerial is not available in this browser.');
  log('Use Chrome or Edge, and ensure the page is served over HTTPS.');
  setStatus('not supported', 'warn');
} else {
  btnFlash.disabled = hexContent.length > 0 ? false : true;
}

btnFlash.addEventListener('click', async () => {
  if (!hexContent) { log('no hex loaded'); return; }
  logEl.textContent = '';
  btnFlash.disabled = true;
  btnStop.disabled = false;
  setStatus('connecting…');

  let port;
  try {
    port = await navigator.serial.requestPort();
  } catch (e) {
    log('port selection cancelled');
    btnFlash.disabled = false;
    btnStop.disabled = true;
    setStatus('');
    return;
  }

  try {
    const result = await flashStc12(port, hexContent, {
      log,
      onPowerCycle: () => {
        setStatus('power-cycle the board NOW', 'warn');
      },
    });
    setStatus(`done: ${result.bytes} bytes`);
    log(`\nFlash complete: ${result.bytes} bytes → ${result.model || 'unknown part'}`);
  } catch (e) {
    log(`\nERROR: ${e.message}`);
    setStatus('failed', 'warn');
  } finally {
    btnFlash.disabled = false;
    btnStop.disabled = true;
    try { await port.close(); } catch {}
  }
});
</script>
</body>
</html>
